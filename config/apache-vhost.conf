<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # mod_php: request shutdown runs unconditionally even if request startup
    # failed - this is the confirmed exploitable mod_php behaviour for
    # CVE-2026-109618 / CVE-2026-109619.
    # (MPM tuning intentionally omitted - image default is mpm_prefork.)

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
