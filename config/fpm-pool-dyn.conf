; G3 fpm pool override - included after www.conf (zz-pool < zz-docker),
; so pm settings here win over the stock dynamic pool.
;
; NOTE: the /urlenc/ ini profile (memory_limit 16M etc., mirroring
; webroot/urlenc/.htaccess which is mod_php-only) is injected per-location
; by nginx via fastcgi_param PHP_VALUE - see config/nginx-default.conf.
; The pool keeps php-lab.ini defaults (64M) so leak2/gassoc.php can
; ini_set memory to 60M at runtime.

[www]
pm = static
pm.max_children = 1
pm.max_requests = 0
request_terminate_timeout = 0
