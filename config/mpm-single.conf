# Lab-only: pin prefork to a single child so the leak request and the exploit
# request (which apache places on different keep-alive connections, because
# the OOM fatal response always carries "Connection: close") are served by
# the SAME worker process.  Worker-identity pinning in a multi-worker deploy
# is orthogonal engineering (kernel accept semantics / connection occupancy)
# This keeps the two halves of the local demonstration on one worker.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    ServerLimit 1
    MaxRequestWorkers 1
</IfModule>
