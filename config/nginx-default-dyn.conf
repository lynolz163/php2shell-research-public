server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64m;
    client_body_buffer_size 1m;

    # leak endpoint: php-lab.ini defaults (64M) - mirrors apache where
    # urlenc/.htaccess does NOT apply outside its directory.  PHP_VALUE is
    # set EXPLICITLY because fpm workers persist ini changes from a previous
    # request's PHP_VALUE (e.g. the 16M profile applied by /urlenc/
    # requests); without this the leak request inherits 16M and OOMs early.
    location ^~ /leak2/ {
        fastcgi_pass vmat-x86_64-8427-rce-4f40c70f-php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "memory_limit=64M
max_input_vars=5000";
    }

    # exploit endpoint: replicate webroot/urlenc/.htaccess (mod_php-only)
    # via the standard fpm per-request ini injection mechanism
    location ~ \.php$ {
        fastcgi_pass vmat-x86_64-8427-rce-4f40c70f-php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "memory_limit=16M
max_input_vars=20000
max_input_nesting_level=64
display_errors=1
error_reporting=-1";
    }
}
