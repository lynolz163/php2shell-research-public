; php2shell-research lab configuration
; Applied on ALL lab containers (vulnerable AND patched) for parity.
; Deviations from php.ini-production defaults are documented in README.md.

memory_limit = 64M
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 100
max_input_nesting_level = 64
max_input_vars = 5000

file_uploads = On
; CVE-2026-109619 confirmed producer path (default-enabled feature)
session.upload_progress.enabled = 1
session.upload_progress.min_freq = 1
session.upload_progress.freq = "1%"

; CVE-2026-109619 consumer / diagnostics visibility
error_reporting = E_ALL
log_errors = On
display_errors = Off
error_log = /var/log/php/php-errors.log

; Keep fatal backtraces OFF (8.5-only feature; lab runs 8.3/8.4)
zend.exception_ignore_args = Off
